services:
  postgres-planner-test:
    container_name: postgres-budget-planner-test
    image: postgres:latest
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
      POSTGRES_DB : ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 5s
      interval: 5s
      retries: 5
  redis-shared-test:
    container_name: redis-shared
    image: redis:8.10-rc2-alpine3.23
    ports:
      - "${EXTERNAL_SHARED_REDIS_PORT}:6379"
    command: redis-server --requirepass ${SHARED_REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${SHARED_REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
  migration-planner-test:
    container_name: migration-budget-planner-test
    build:
      context: ../../
      dockerfile: ./services/budget/Dockerfile
    entrypoint: ["./migrator"]
    environment:
      DSN : ${DSN_TEST_MIGRATION}
    restart: "no"
    depends_on:
      postgres-planner-test:
        condition: service_healthy