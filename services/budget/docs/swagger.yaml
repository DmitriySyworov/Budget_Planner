        "429":
          description: 'Too many requests. Format: { \"errors\": { \"global\": \"the
            limit for sending requests per minute has been exceeded\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "500":
          description: 'Server errors. Format: { \"errors\": { \"global\": \"critical
            error on the server side\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
      summary: Get a specific expense transaction details
      tags:
      - expense
    patch:
      consumes:
      - application/json
      description: Updates an individual expense transaction's category, expense amount,
        or description by its UUID under a specific budget. Validates the existence
        of the parent budget, the main expense container, and the specific transaction
        record.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
