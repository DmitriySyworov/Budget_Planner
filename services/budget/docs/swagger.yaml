          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "429":
          description: 'Too many requests. Format: { \"errors\": { \"global\": \"the
            limit for sending requests per minute has been exceeded\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "500":
          description: 'Server errors. Format: { \"errors\": { \"global\": \"critical
            error on the server side\" } } or { \"errors\": { \"global\": \"failed
            to delete expense\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
      summary: Delete an individual expense transaction
      tags:
      - expense
    get:
      consumes:
      - application/json
      description: 'Retrieves the complete data of an individual expense transaction
        by its UUID under a specific budget. Validates the entity existence chain:
        parent budget, expense container, and the specific transaction.'
