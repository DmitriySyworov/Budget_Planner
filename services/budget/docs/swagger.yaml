                  type: object
              type: object
        "400":
          description: 'Validation or business logic errors. Format: { \"errors\":
            { \"expense\": \"expense must be a positive decimals and greater than
            0\" } } or { \"errors\": { \"category\": \"category mast be a health,
            sport, supermarket, restaurant, leisure, investments, savings or other\"
            } } or { \"errors\": { \"description\": \"description cannot be more than
