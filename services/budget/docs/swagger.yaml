host: localhost:8081
info:
  contact: {}
  description: Financial planning and management service. Provides personal budgeting,
    automated expense tracking, and advanced financial analytics.
  title: Budget Planner Microservice API
  version: "1.0"
paths:
  /api/v1/description-expense/{budget_uuid}:
    get:
      consumes:
      - application/json
      description: Retrieves a collection of detailed expense transactions for a specific
        budget using its UUID. Supports pagination via limit and offset query parameters.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Parent Budget UUID (36 characters)
        in: path
        name: budget_uuid
        required: true
        type: string
      - description: Maximum number of records to return (positive integer, max 100)
        in: query
        name: limit
        type: string
      - description: Number of records to skip (positive integer)
        in: query
        name: offset
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of expense transactions successfully retrieved
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/app_budget-planner_internal_model.DescriptionExpenses'
                  type: array
                errors:
                  type: object
              type: object
        "400":
          description: 'Validation or business logic errors. Format: { \"errors\":
            { \"limit\": \"the limit must be a positive integer not greater than 100\"
            } } or { \"errors\": { \"offset\": \"the offset must be a positive integer\"
            } } or { \"errors\": { \"expense\": \"not found expense\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "401":
          description: 'Authentication errors. Format: { \"errors\": { \"auth\": \"invalid
            access token\" } } or { \"errors\": { \"auth\": \"access token has expired\"
            } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "404":
          description: 'Data errors. Format: { \"errors\": { \"expense\": \"not found
            description expense\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "429":
          description: 'Too many requests. Format: { \"errors\": { \"global\": \"the
            limit for sending requests per minute has been exceeded\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "500":
          description: 'Server errors. Format: { \"errors\": { \"global\": \"critical
            error on the server side\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
      summary: Get a paginated list of individual expense transactions
      tags:
      - expense
    post:
      consumes:
      - application/json
      description: Creates a detailed expense record and associates it with a specific
        budget by UUID. If the parent expense container does not exist, it initializes
        one automatically. Validates transaction category constraints and overall
        budget existence.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Parent Budget UUID (36 characters)
        in: path
        name: budget_uuid
        required: true
        type: string
      - description: Expense creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_expense.RequestCreateDescriptionExpense'
      produces:
      - application/json
      responses:
        "201":
          description: Expense transaction successfully recorded
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_expense.ResponseCreateAndUpdateExpense'
                errors:
                  type: object
              type: object
        "400":
          description: 'Validation or business logic errors. Format: { \"errors\":
            { \"expense\": \"expense must be a positive decimals and greater than
            0\" } } or { \"errors\": { \"category\": \"category mast be a health,
            sport, supermarket, restaurant, leisure, investments, savings or other\"
            } } or { \"errors\": { \"description\": \"description cannot be more than
            250 characters\" } } or { \"errors\": { \"budget\": \"the budget uuid
            must be exactly 36 characters\" } } or { \"errors\": { \"body\": \"<raw_body_error>\"
            } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "401":
          description: 'Authentication errors. Format: { \"errors\": { \"auth\": \"invalid
            access token\" } } or { \"errors\": { \"auth\": \"access token has expired\"
            } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "404":
          description: 'Data errors. Format: { \"errors\": { \"budget\": \"not found
            budget\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "429":
          description: 'Too many requests. Format: { \"errors\": { \"global\": \"the
            limit for sending requests per minute has been exceeded\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "500":
          description: 'Server errors. Format: { \"errors\": { \"global\": \"critical
            error on the server side\" } } or { \"errors\": { \"global\": \"failed
            to create expense\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
      summary: Create a new expense transaction under a budget
      tags:
      - expense
  /api/v1/description-expense/{budget_uuid}/{description_expense_uuid}:
    delete:
      consumes:
      - application/json
      description: Deletes a specific expense transaction record by its UUID under
