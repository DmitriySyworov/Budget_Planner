      - description: Specific Transaction UUID (36 characters)
        in: path
        name: description_expense_uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Expense transaction successfully deleted, no content returned
        "400":
          description: 'Validation or business logic errors. Format: { \"errors\":
            { \"budget\": \"the budget uuid must be exactly 36 characters\" } }'
          schema:
            $ref: '#/definitions/response.NegativeResponse'
        "401":
          description: 'Authentication errors. Format: { \"errors\": { \"auth\": \"invalid
            access token\" } } or { \"errors\": { \"auth\": \"access token has expired\"
