versions:
  authUserVersion: "v1"
  budgetPlannerVersion: "v1"
  notificationVersion: "v1"
  defaultVersion: "v1"
replicasCount:
  authReplicas: 3
  budgetReplicas: 3
  notificationReplicas: 3
  defaultReplicas: 3
microservices:
  - name : app-auth-user
    image : "dmitriysyworov/auth-user-service"
    port : 8080
    ingressPaths:
      - /api/v1/register
      - /api/v1/login
      - /api/v1/recovery
      - /api/v1/refresh
      - /api/v1/logout-
      - /api/v1/confirm
      - /api/v1/user
    host: "budget-planner"
    service:
      type: NodePort
      port: 80
      nodePort: 32000
    checkLivenessProbe: true
    secretName: "auth-user-all-secrets"
  - name : app-budget-planner
    image: "dmitriysyworov/budget-planner-service"
    port: 8080
    ingressPaths:
      - /api/v1/budget
      - /api/v1/expense
      - /api/v1/description-expense
      - /api/v1/finance
    host: "budget-planner"
    service:
      type: NodePort
      port: 80
      nodePort: 32001
    checkLivenessProbe: true
    secretName: "budget-planner-all-secrets"
  - name : notification
    image : "dmitriysyworov/notification"
    port : 8080
    service:
      type: ClusterIP
      port: 80
    secretName: "notification-all-secrets"
statefulServices:
  - name: postgres-user
    image: "postgres:18-alpine"
    port: 5432
    replicas: 1
    storageSize: "1Gi"
    mountPath: "/var/lib/postgresql/18/data"
    secretName: "auth-user-all-secrets"
  - name : redis-auth
    image: "redis:8-alpine"
    port: 6379
    replicas: 1
    storageSize: "1Gi"
    mountPath: "/data"
    isRedis : true
    secretName: "auth-user-all-secrets"
  - name: postgres-budget
    image: "postgres:18-alpine"
    port: 5432
    replicas: 1
    storageSize: "1Gi"
    mountPath: "/var/lib/postgresql/18/data"
    secretName: "budget-planner-all-secrets"
  - name : redis-shared
    image: "redis:8-alpine"
    port: 6379
    replicas: 1
    storageSize: "1Gi"
    mountPath: "/data"
    isSharedRedis : true
    secretName: "redis-shared-all-secrets"
jobServices:
  - name: migrations-budget-planner
    image: "dmitriysyworov/budget-planner-service"
    command: [ "./migrator" ]
    dbHost: "postgres-budget-service"
    dbPort: 5432
    secretName: "budget-planner-all-secrets"
  - name: migrations-user
    image: "dmitriysyworov/auth-user-service"
    command: [ "./migrator" ]
    dbHost: "postgres-user-service"
    dbPort: 5432
    secretName: "auth-user-all-secrets"
  - name: kafka-create-topics
    image: "soldevelo/kafka:4.3.1"
    dbHost: "my-kafka-chart"
    dbPort: 9092
    isTopicCreator: true
    bootstrapServer: "my-kafka-chart:9092"
    extraEnv:
      - name: KAFKA_CLIENT_USER
        value: "user1"
      - name: KAFKA_CLIENT_PASSWORD
        value: "example_password"
    topics:
      - name: "deleted-users-topic"
        partitions: 3
      - name: "notification-topic"
        partitions: 3
secrets:
  - secretName: "redis-shared-all-secrets"
    envSecrets:
      - name: SHARED_REDIS_ADDRESS
        key: shared-redis-address
        value: 'redis-shared-service:6379'
      - name: SHARED_REDIS_PASSWORD
        key: shared-redis-password
        value: 'example_password'
  - secretName: "auth-user-all-secrets"
    envSecrets:
      - name: DSN
        key: dsn
        value: 'host=postgres-user-service user=example_user password=example_password dbname=example_db port=5432 sslmode=disable'
      - name: JWT_SIGNATURE
        key: jwt-signature
        value: '*.01?Ue)p6]H=|C:o-.2z%5R^]@}:r9E_&k#4LC(bOR'
      - name: POSTGRES_USER
        key: postgres-user
        value: 'example_user'
      - name: POSTGRES_PASSWORD
        key: postgres-password
        value: 'example_password'
      - name: POSTGRES_DB
        key: postgres-db
        value: 'example_db'
      - name: REDIS_ADDRESS
        key: redis-address
        value: 'redis-auth-service:6379'
      - name: REDIS_PASSWORD
        key: redis-password
        value: 'example_password'
      - name: KAFKA_CLIENT_USER
        key: kafka-user
        value: "user1"
      - name: KAFKA_CLIENT_PASSWORD
        key: kafka-password
        value: "example_password"
      - name: KAFKA_BOOTSTRAP
        key: kafka-bootstrap
        value: "my-kafka-chart:9092"
      - name: DELETED_USERS_TOPIC
        key: deleted-users-topic
        value: "deleted-users-topic"
      - name: NOTIFICATION_TOPIC
        key: notification-topic
        value: "notification-topic"
      - name: SHARED_REDIS_ADDRESS
        key: shared-redis-address
        value: 'redis-shared-service:6379'
      - name: SHARED_REDIS_PASSWORD
        key: shared-redis-password
        value: 'example_password'
  - secretName: "notification-all-secrets"
    envSecrets:
      - name: API_EMAIL
        key: api-email
        value: 'example@gmail.com'
      - name: API_PASSWORD
        key: api-password
        value: 'example_password'
      - name: SMTP_ADDRESS
        key: smtp-address
        value: 'smtp.gmail.com'
      - name: SMTP_ADDRESS_HOST
        key: smtp-address-host
        value: 'smtp.gmail.com:587'
      - name: KAFKA_CLIENT_USER
        key: kafka-user
        value: "user1"
      - name: KAFKA_CLIENT_PASSWORD
        key: kafka-password
        value: "example_password"
      - name: KAFKA_BOOTSTRAP
        key: kafka-bootstrap
        value: "my-kafka-chart:9092"
      - name: NOTIFICATION_TOPIC
        key: notification-topic
        value: "notification-topic"
      - name: NOTIFICATION_GROUP_ID
        key: notification-group-id
        value: "notification-group-id"
      - name: SHARED_REDIS_ADDRESS
        key: shared-redis-address
        value: 'redis-shared-service:6379'
      - name: SHARED_REDIS_PASSWORD
        key: shared-redis-password
        value: 'example_password'
  - secretName: "budget-planner-all-secrets"
    envSecrets:
      - name: DSN
        key: dsn
        value: 'host=postgres-budget-service user=example_user password=example_password dbname=example_db port=5432 sslmode=disable'
      - name: JWT_SIGNATURE
        key: jwt-signature
        value: '*.01?Ue)p6]H=|C:o-.2z%5R^]@}:r9E_&k#4LC(bOR'
      - name: POSTGRES_USER
        key: postgres-budget
        value: 'example_user'
      - name: POSTGRES_PASSWORD
        key: postgres-password
        value: 'example_password'
      - name: POSTGRES_DB
        key: postgres-db
        value: 'example_db'
      - name: KAFKA_CLIENT_USER
        key: kafka-user
        value: "user1"
      - name: KAFKA_CLIENT_PASSWORD
        key: kafka-password
        value: "example_password"
      - name: KAFKA_BOOTSTRAP
        key: kafka-bootstrap
        value: "my-kafka-chart:9092"
      - name: DELETED_USERS_TOPIC
        key: deleted-users-topic
        value: "deleted-users-topic"
      - name: BUDGET_DELETE_GROUP_ID
        key: budget-delete-group-id
        value: "budget-delete-group-id"
      - name: SHARED_REDIS_ADDRESS
        key: shared-redis-address
        value: 'redis-shared-service:6379'
      - name: SHARED_REDIS_PASSWORD
        key: shared-redis-password
        value: 'example_password'
  - secretName: "kafka-all-secrets"
    envSecrets:
      - name: KAFKA_CLIENT_USER
        key: kafka-user
        value: "user1"
      - name: KAFKA_CLIENT_PASSWORD
        key: kafka-password
        value: "example_password"
      - name: KAFKA_BOOTSTRAP
        key: kafka-bootstrap
        value: "my-kafka-chart:9092"
# Kafka options
controller:
  replicaCount: 1

resources:
  requests:
    memory: "768Mi"
    cpu: "250m"
  limits:
    memory: "1536Mi"
    cpu: "1"

heapOpts: "-Xmx512m -Xms512m"

listeners:
  client:
    protocol: SASL_PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
sasl:
  client:
    users:
      - "user1"
    passwords:
      - "example_password"

extraEnvVars:
  - name: KAFKA_HEALTHCHECK_PORT
    value: "9094"

extraConfig: |
  offsets.topic.replication.factor=1
  offsets.topic.num.partitions=1
  default.replication.factor=1
  auto.create.topics.enable=true
  allow.everyone.if.no.acl.found=true
  sasl.enabled.mechanisms=SCRAM-SHA-256
  offsets.topic.min.insync.replicas=1
  transaction.state.log.min.insync.replicas=1
  transaction.state.log.replication.factor=1
  transaction.state.log.num.partitions=1
  group.initial.rebalance.delay.ms=15000
  group.max.session.timeout.ms=60000
  group.coordinator.min.rebalance.timeout.ms=10000