{{- range .Values.jobServices }}
{{- $outside := . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}-job
  namespace: default
spec:
  completions: 1
  backoffLimit: 5
  activeDeadlineSeconds: 200
  ttlSecondsAfterFinished: 10
  template:
    metadata:
      name: {{ .name }}-pod
    spec:
      restartPolicy: Never
      initContainers:
        {{- if .isTopicCreator }}
        - name: wait-for-kafka
          image: busybox:latest
          command:
            - "sh"
            - "-c"
            - "until nc -z -v -w3 my-kafka-chart 9092; do echo 'Waiting for Kafka secure port...'; sleep 2; done"
        {{- else }}
        - name: wait-for-db
          image: busybox:latest
          command:
            - "sh"
            - "-c"
            - "until nc -z -v -w3 {{ .dbHost }} {{ .dbPort }}; do echo 'Waiting for Database...'; sleep 2; done"
        {{- end }}
      containers:
        - name: {{ .name }}-tool
          {{- $resultImage := .image}}
          {{- if contains "user" .name }}
          {{- $resultImage = printf "%s:%s" .image $.Values.versions.authUserVersion }}
          {{- else if contains "budget-planner" .name }}
          {{- $resultImage = printf "%s:%s" .image $.Values.versions.budgetPlannerVersion }}
          {{- end }}
          image: {{ $resultImage | quote}}
          {{- if .isTopicCreator }}
          command:
            - "sh"
            - "-c"
            - |
              kafka-configs.sh --bootstrap-server my-kafka-chart-controller-0.my-kafka-chart-headless:9094 \
                --entity-type users --entity-name $KAFKA_CLIENT_USER --alter \
                --add-config "SCRAM-SHA-512=[password=$KAFKA_CLIENT_PASSWORD]"

              kafka-topics.sh --bootstrap-server my-kafka-chart-controller-0.my-kafka-chart-headless:9094 \
                --create --if-not-exists \
                --topic "__consumer_offsets" \
                --partitions 1 \
                --replication-factor 1 \
                --config cleanup.policy=compact \
                --config segment.bytes=104857600

              echo "security.protocol=SASL_PLAINTEXT" > /tmp/client.properties
              echo "sasl.mechanism=SCRAM-SHA-512" >> /tmp/client.properties
              echo "sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username=\"$KAFKA_CLIENT_USER\" password=\"$KAFKA_CLIENT_PASSWORD\";" >> /tmp/client.properties

              {{- $outsideJob := . }}
              {{- range .topics }}
              kafka-topics.sh --bootstrap-server {{ $outsideJob.bootstrapServer }} \
                --command-config /tmp/client.properties \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor 1
              {{- end }}
              rm -f /tmp/client.properties
          env:
            {{- range .extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- else }}
          command: {{ .command }}
          env:
            {{- range $.Values.secrets }}
            {{- if eq .secretName $outside.secretName}}
            {{- range .envSecrets}}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $outside.secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
---
{{- end }}
