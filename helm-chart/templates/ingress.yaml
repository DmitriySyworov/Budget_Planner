{{- range .Values.microservices }}
{{- $outside := . }}
{{- if .ingressPaths }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          {{- range .ingressPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $outside.name }}-service
                port:
                  number: {{ $outside.port }}
          {{- end }}
---
{{- end }}
{{- end }}