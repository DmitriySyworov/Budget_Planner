{{- range .Values.microservices }}
{{- $outside := . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-service
  namespace: default
spec:
  selector:
    app: {{ .name }}
  ports:
    - protocol: TCP
      port: {{ .service.port | default .port }}
      {{- $targetPort := 8080 }}
      {{- range $.Values.secrets }}
        {{- if eq .secretName $outside.secretName}}
        {{- range .envSecrets}}
        {{- if eq .name "EXTERNAL_API_PORT"}}
        {{- $targetPort = .value}}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
      targetPort: {{ $targetPort }}
      {{- if and .service .service.nodePort }}
      nodePort: {{ .service.nodePort }}
      {{- end }}
  type: {{ .service.type | default "ClusterIP" }}
---
{{- end }}

{{- range .Values.statefulServices }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-service
  namespace: default
spec:
  clusterIP: None
  selector:
    app: {{ .name }}
  ports:
    - protocol: TCP
      port: {{ .port }}
      targetPort: {{ .port }}
  type: ClusterIP
---
{{- end }}